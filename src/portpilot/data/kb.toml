# PortPilot knowledge base: Linux features that need attention when porting to QNX 8.0.
#
# Every rule cites at least one source:
#   qnx-*  the official QNX porting guide
#   gt-*   PortPilot ground truth (real ports + probes run on QNX 8.0, see docs/ground-truth.md)
#   sdp    the QNX SDP 8.0 inventory (`portpilot sdp-index`); availability is re-checked against
#          YOUR SDP whenever an index is present.
#
# fix:      rule      PortPilot applies a known, safe transformation
#           assisted  small, local change; AI-assisted, kept only if the build/tests pass
#           manual    needs a redesign; PortPilot links the guidance
#           none      informational
# severity: blocker   will not compile/link/run on QNX as-is
#           fix       will not build as-is, but the fix is mechanical
#           warn      builds, but behaves differently on QNX
#           info      worth knowing

[sources.qnx-syscall]
title = "QNX porting guide: system call replacement matrix"
url = "https://www.qnx.com/developers/docs/qnxeverywhere/com.qnx.doc.qpg/topic/porting_Sys_call_replacement.html"
[sources.qnx-depmap]
title = "QNX porting guide: dependency mapping"
url = "https://www.qnx.com/developers/docs/qnxeverywhere/com.qnx.doc.qpg/topic/porting_Dependency_mapping.html"
[sources.qnx-deep]
title = "QNX porting guide: deep component analysis"
url = "https://www.qnx.com/developers/docs/qnxeverywhere/com.qnx.doc.qpg/topic/porting_Deep_analysis.html"
[sources.qnx-shim]
title = "QNX porting guide: creating shim files for Linux system calls"
url = "https://www.qnx.com/developers/docs/qnxeverywhere/com.qnx.doc.qpg/topic/sysarch_Create_shim.html"
[sources.qnx-ports]
title = "qnx-ports/build-files: official QNX ports"
url = "https://github.com/qnx-ports/build-files"
[sources.sdp]
