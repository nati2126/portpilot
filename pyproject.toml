[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "portpilot"
version = "0.1.0"
description = "Port Linux C/C++ libraries to QNX 8.0: scan, fix, build, and verify on a QNX target."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nathnael Dejene" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
portpilot = "portpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.ruff.lint.per-file-ignores]
# make/CMake templates must stay byte-identical to the build-files conventions
"src/portpilot/scaffold.py" = ["E501"]
